name: Update CITATION.cff Version

on:
  push:
    tags:
      - 'v*'

jobs:
  update-citation:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Tag and Date
        id: vars
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/v}
          RELEASE_DATE=$(date -u +'%Y-%m-%d')
          echo "version=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "date=${RELEASE_DATE}" >> $GITHUB_OUTPUT

      - name: Update CITATION.cff
        run: |
          sed -i "s/^version: .*/version: \"${{ steps.vars.outputs.version }}\"/" CITATION.cff
          sed -i "s/^date-released: .*/date-released: \"${{ steps.vars.outputs.date }}\"/" CITATION.cff

      - name: Commit and Push Updated CITATION.cff
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add CITATION.cff
          git diff --quiet && git diff --staged --quiet || git commit -m "docs: bump version in CITATION.cff to ${{ steps.vars.outputs.version }}"
          git push origin HEAD:main
