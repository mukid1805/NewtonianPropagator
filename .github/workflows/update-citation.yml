name: Update CITATION.cff Version

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
  update-citation:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract Tag and Date
        id: vars
        run: |
          RAW_TAG=${GITHUB_REF#refs/tags/}
          TAG_NAME=${RAW_TAG#v}
          RELEASE_DATE=$(date -u +'%Y-%m-%d')
          echo "raw_tag=${RAW_TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "date=${RELEASE_DATE}" >> $GITHUB_OUTPUT

      - name: Update CITATION.cff
        run: |
          sed -i "s/^version: .*/version: \"${{ steps.vars.outputs.version }}\"/" CITATION.cff
          sed -i "s/^date-released: .*/date-released: \"${{ steps.vars.outputs.date }}\"/" CITATION.cff

      - name: Commit, Retag, and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add CITATION.cff
          if ! git diff --staged --quiet; then
            git commit -m "docs: bump version in CITATION.cff to ${{ steps.vars.outputs.version }} [skip ci]"
            git pull origin main --rebase
            git push origin main

            # Move the tag to point to the newly created commit on main
            git tag -f "${{ steps.vars.outputs.raw_tag }}"
            git push origin "${{ steps.vars.outputs.raw_tag }}" --force
          fi